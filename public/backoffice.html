<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R'pizz — Back Office</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bo-page">

<header class="bo-header">
  <div class="header-inner">
    <div class="logo">R'<em>pizz</em> · Back Office</div>
    <div class="bo-controls" id="orders-controls">
      <input type="date" id="filter-date" value="">
      <select id="filter-status">
        <option value="">Tous les statuts</option>
        <option value="en_attente">En attente</option>
        <option value="en_preparation">En préparation</option>
        <option value="pret">Prêt</option>
        <option value="livre">Livré / Remis</option>
        <option value="annule">Annulé</option>
      </select>
      <button class="btn-refresh" onclick="refresh()">🔄 Actualiser</button>
      <a href="/" class="btn-cta">Voir le site <span>→</span></a>
    </div>
  </div>
</header>

<main class="bo-main">

  <!-- Onglets -->
  <div class="bo-tabs">
    <button class="bo-tab active" data-view="commandes">📋 Commandes</button>
    <button class="bo-tab" data-view="clients">👥 Clients</button>
    <button class="bo-tab" data-view="stats">📊 Statistiques</button>
  </div>

  <!-- VUE COMMANDES -->
  <div id="view-commandes" class="bo-view">
    <div class="bo-stats" id="bo-stats"></div>
    <div id="orders-container" class="orders-grid">
      <p class="loading">Chargement...</p>
    </div>
  </div>

  <!-- VUE CLIENTS -->
  <div id="view-clients" class="bo-view" style="display:none">
    <div class="bo-panel">
      <h3>👥 Base de données clients</h3>
      <div class="clients-table-wrap">
        <table class="clients-table" id="clients-table">
          <thead>
            <tr>
              <th>Client</th><th>Téléphone</th><th>Adresse(s)</th>
              <th>Commandes</th><th>Total dépensé</th><th>Panier moyen</th><th>Dernière</th>
            </tr>
          </thead>
          <tbody id="clients-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- VUE STATS -->
  <div id="view-stats" class="bo-view" style="display:none">
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="bo-panel">
      <h3>Répartition du chiffre d'affaires</h3>
      <div class="split-bars" id="split-bars"></div>
    </div>
    <div class="bo-panel">
      <h3>🏆 Top 5 des articles</h3>
      <div class="top-list" id="top-list"></div>
    </div>
  </div>

</main>

<!-- PRINT MODAL -->
<div id="print-modal" class="overlay" style="display:none">
  <div class="confirm-card print-card" id="print-content"></div>
</div>

<script src="backoffice.js"></script>
</body>
</html>
